# Egress proxy for headless Chrome (Browserless), #127.
#
# Rendered extraction loads arbitrary third-party pages. Chrome resolves DNS
# itself, so a hostname that is public at validation time can resolve to an
# internal address when the browser connects (DNS rebinding), and a page can
# make the browser fetch internal services. All browser traffic goes through
# this proxy, which checks the address *it* resolved and connects to, and
# refuses anything that is not globally routable.

http_port 3128

# Destinations that must never be reached from the renderer.
acl blocked_dst dst 0.0.0.0/8          # "this" network
acl blocked_dst dst 10.0.0.0/8         # RFC 1918
acl blocked_dst dst 100.64.0.0/10      # carrier-grade NAT
acl blocked_dst dst 127.0.0.0/8        # loopback
acl blocked_dst dst 169.254.0.0/16     # link-local, cloud metadata
acl blocked_dst dst 172.16.0.0/12      # RFC 1918 (includes Docker networks)
acl blocked_dst dst 192.0.0.0/24       # IETF protocol assignments
acl blocked_dst dst 192.168.0.0/16     # RFC 1918
acl blocked_dst dst 198.18.0.0/15      # benchmarking
acl blocked_dst dst 224.0.0.0/4        # multicast
acl blocked_dst dst 240.0.0.0/4        # reserved
acl blocked_dst dst ::1/128            # IPv6 loopback
acl blocked_dst dst fc00::/7           # IPv6 unique local
acl blocked_dst dst fe80::/10          # IPv6 link-local
acl blocked_dst dst ::ffff:0:0/96      # IPv4-mapped IPv6

acl web_ports port 80 443
acl CONNECT method CONNECT

http_access deny blocked_dst
http_access deny !web_ports
http_access deny CONNECT !web_ports
http_access allow all

# No caching, no identifying headers.
cache deny all
forwarded_for delete
via off
dns_v4_first on
