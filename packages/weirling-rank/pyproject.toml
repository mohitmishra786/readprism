[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "weirling-rank"
version = "0.1.0"
description = "Explainable personalized recommendation ranker for feeds and reading digests"
readme = "README.md"
authors = [
    { name = "Weirling Authors" }
]

license = { text = "MIT" }
requires-python = ">=3.11"
keywords = ["ranking", "recommendation", "rss", "feed", "digest", "explainability"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
    "numpy>=1.24.0",
]


[project.urls]
Source = "https://github.com/mohitmishra786/weirling/tree/main/packages/weirling-rank"

[project.optional-dependencies]
test = [
    "pytest>=7.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["weirling_rank*"]

[tool.pytest.ini_options]
pythonpath = ["."]
