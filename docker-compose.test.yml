# Test dependencies for running the suite on the host.
# Usage:
#   docker compose -f docker-compose.test.yml up -d
#   cd backend && pytest
#   docker compose -f docker-compose.test.yml down -v
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: readprism
      POSTGRES_PASSWORD: readprism
      POSTGRES_DB: readprism_test
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U readprism -d readprism_test"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
