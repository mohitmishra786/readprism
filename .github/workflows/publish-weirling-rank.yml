name: Publish weirling-rank

on:
  push:
    tags:
      - "weirling-rank-v*"
      - "v*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (build and check only, do not upload)"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  build-and-publish:
    name: Build and publish weirling-rank
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/weirling-rank
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install build and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build twine pytest numpy

      - name: Run package unit tests
        run: pytest

      - name: Build wheel and source distribution
        run: python -m build

      - name: Check package distribution artifacts
        run: twine check dist/*

      - name: Test installation of built wheel
        run: |
          WHEEL=$(ls dist/*.whl | head -n 1)
          pip install "$WHEEL"
          python -c "import weirling_rank; print('Successfully imported weirling_rank', weirling_rank.__version__)"

      - name: Publish to PyPI
        if: ${{ !github.event.inputs.dry_run && startsWith(github.ref, 'refs/tags/') }}
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: twine upload --skip-existing dist/*
