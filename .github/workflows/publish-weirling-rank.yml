# Publish weirling-rank to PyPI (#245). Only on its own tags
# (weirling-rank-vX.Y.Z), never on app releases. Uses PyPI Trusted Publishing:
# no token in the repo. Before the first release, add this repository and
# workflow as a trusted publisher on pypi.org (project "weirling-rank").
name: Publish weirling-rank

on:
  push:
    tags:
      - "weirling-rank-v*"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/weirling-rank
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Test, build and check
        run: |
          python -m pip install --upgrade pip
          pip install build twine pytest numpy
          # weirling_rank/ is a symlink to backend/weirling_rank: one source.
          pytest -q
          python -m build
          twine check dist/*
          pip install dist/*.whl
          cd /tmp && python -c "import weirling_rank; print(weirling_rank.__version__)"
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: packages/weirling-rank/dist/

  publish:
    # Manual runs only build; publishing needs a weirling-rank-v* tag.
    if: startsWith(github.ref, 'refs/tags/weirling-rank-v')
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # Trusted Publishing
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
