# Publish container images to GHCR (RL-01). Semver tags get versioned images;
# main gets :latest. Lite variant published alongside with the -lite suffix.
name: Publish images

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}/readprism-backend
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}
      - uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # Lite variant (no torch): <tag>-lite
      - uses: docker/metadata-action@v5
        id: meta_lite
        with:
          images: ghcr.io/${{ github.repository }}/readprism-backend
          tags: |
            type=semver,pattern={{version}}-lite
            type=raw,value=latest-lite,enable={{is_default_branch}}
      - uses: docker/build-push-action@v6
        with:
          context: ./backend
          build-args: LITE=1
          push: true
          tags: ${{ steps.meta_lite.outputs.tags }}
          cache-from: type=gha
      - uses: docker/metadata-action@v5
        id: meta_front
        with:
          images: ghcr.io/${{ github.repository }}/readprism-frontend
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}
      - uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: ${{ steps.meta_front.outputs.tags }}
          cache-from: type=gha
