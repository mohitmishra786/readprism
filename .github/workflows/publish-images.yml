# Publish container images to GHCR (RL-01). Semver tags get versioned images;
# main gets :latest. Lite variant published alongside with the -lite suffix.
name: Publish images

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v6
        id: meta
        with:
          # Weirling rename (#340): full paths, so it works before and after the repo
          # rename; the old name keeps updating until v0.4 for installs that have not
          # pulled the new compose file.
          images: |
            ghcr.io/mohitmishra786/weirling/weirling-backend
            ghcr.io/mohitmishra786/readprism/readprism-backend
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}
      - uses: docker/build-push-action@v7
        with:
          context: ./backend
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # Lite variant (no torch): <tag>-lite
      - uses: docker/metadata-action@v6
        id: meta_lite
        with:
          # Weirling rename (#340): full paths, so it works before and after the repo
          # rename; the old name keeps updating until v0.4 for installs that have not
          # pulled the new compose file.
          images: |
            ghcr.io/mohitmishra786/weirling/weirling-backend
            ghcr.io/mohitmishra786/readprism/readprism-backend
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}-lite
            type=raw,value=latest-lite,enable={{is_default_branch}}
      - uses: docker/build-push-action@v7
        with:
          context: ./backend
          build-args: LITE=1
          push: true
          tags: ${{ steps.meta_lite.outputs.tags }}
          cache-from: type=gha
      - uses: docker/metadata-action@v6
        id: meta_front
        with:
          # Weirling rename (#340): full paths, so it works before and after the repo
          # rename; the old name keeps updating until v0.4 for installs that have not
          # pulled the new compose file.
          images: |
            ghcr.io/mohitmishra786/weirling/weirling-frontend
            ghcr.io/mohitmishra786/readprism/readprism-frontend
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}
      - uses: docker/build-push-action@v7
        with:
          context: ./frontend
          push: true
          tags: ${{ steps.meta_front.outputs.tags }}
          cache-from: type=gha
      # All-in-one image (#208): API, workers, beat and web under s6.
      - uses: docker/metadata-action@v6
        id: meta_aio
        with:
          # Weirling rename (#340): full paths, so it works before and after the repo
          # rename; the old name keeps updating until v0.4 for installs that have not
          # pulled the new compose file.
          images: |
            ghcr.io/mohitmishra786/weirling/weirling-aio
            ghcr.io/mohitmishra786/readprism/readprism-aio
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/aio/Dockerfile
          push: true
          tags: ${{ steps.meta_aio.outputs.tags }}
          cache-from: type=gha
