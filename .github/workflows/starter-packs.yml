# Starter-pack liveness (CS-02): >= 90% of pack feeds must respond, weekly.
name: Starter packs

on:
  schedule:
    # Weekly — Mondays 03:40 UTC (offset from other scheduled jobs).
    - cron: "40 3 * * 1"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  liveness:
    name: Feed liveness (>= 90%)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install httpx
        run: pip install httpx
      - name: Check packs
        working-directory: backend
        env:
          PYTHONPATH: .
        run: python3 scripts/check_starter_packs.py
