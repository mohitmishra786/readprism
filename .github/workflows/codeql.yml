# CodeQL semantic code analysis — weekly scan of the default branch.
# Catches security vulnerabilities (SQL injection, XSS, path traversal, etc.)
# that dependency scanning misses.
#
# Deliberately NOT run per-PR/per-push: it is a scanner, not a build gate, and
# per-PR analysis was the single largest CI consumer. Results land in the
# Security tab weekly; vulnerable dependencies are covered separately by the
# daily Dependabot security alerts (which are free).
name: "CodeQL"

on:
  schedule:
    # Weekly scan of the default branch — Mondays 02:00 UTC.
    - cron: "0 2 * * 1"
  workflow_dispatch: {}

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Python (backend) + JavaScript/TypeScript (frontend).
        language: [python, javascript-typescript]

    steps:
      - uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          # Use the default security-and-quality suite for deeper analysis.
          queries: security-and-quality
          # Exclude non-runtime code (dev/ops scripts, tests) from analysis.
          config-file: ./.github/codeql/codeql-config.yml

      - name: Autobuild
        uses: github/codeql-action/autobuild@v4

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
