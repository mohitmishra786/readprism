# Dependabot configuration for Weirling.
#
# Strategy:
# - Security fixes: Dependabot security updates are ON for the repo (Settings
#   -> Code security). They are not on this schedule: a PR opens as soon as an
#   advisory matches (GitHub re-checks at least daily). The groups below apply
#   to version updates only, so each security fix arrives as its own small PR.
# - Routine version updates: WEEKLY (Monday), grouped into one PR per
#   ecosystem so reviews are batched.
# - Major versions are held for pip (backend stability); allowed for npm except
#   tailwindcss/typescript, which need manual migrations.

version: 2

updates:
  # ──────────────────────────────────────────────────────────────
  # Backend: Python (pip) — weekly, grouped
  # ──────────────────────────────────────────────────────────────
  - package-ecosystem: "pip"
    directory: "/backend"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    # Group ALL pip updates into a single PR.
    groups:
      python-dependencies:
        applies-to: version-updates
        patterns:
          - "*"
    # Backend stability is critical — only patch + minor, no majors.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: "deps(backend)"
      include: "scope"
    labels:
      - "dependencies"
      - "backend"

  # ──────────────────────────────────────────────────────────────
  # Frontend: npm — weekly, grouped
  # ──────────────────────────────────────────────────────────────
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    # Group production + dev deps separately so Next/React majors are reviewable
    # apart from tooling bumps. Both still batch many deps into few PRs.
    groups:
      npm-production:
        applies-to: version-updates
        patterns:
          - "next"
          - "react"
          - "react-dom"
          - "js-cookie"
      npm-dev:
        applies-to: version-updates
        patterns:
          - "*"
        exclude-patterns:
          - "next"
          - "react"
          - "react-dom"
          - "js-cookie"
    commit-message:
      prefix: "deps(frontend)"
      include: "scope"
    labels:
      - "dependencies"
      - "frontend"
    # tailwindcss v3→v4 and typescript v5→v6 are breaking majors that require
    # manual migration work (config/engine changes). They are taken up
    # deliberately, not auto-filed. Suppress their major-update PRs.
    ignore:
      - dependency-name: "tailwindcss"
        update-types: ["version-update:semver-major"]
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  # ──────────────────────────────────────────────────────────────
  # Docker base images — weekly
  # ──────────────────────────────────────────────────────────────
  - package-ecosystem: "docker"
    directory: "/backend"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 2
    # Python minor jumps (3.12 -> 3.15) wait until torch ships wheels for the
    # new version; without them the standard image can't build (#349).
    ignore:
      - dependency-name: "python"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
    labels:
      - "dependencies"
      - "docker"

  - package-ecosystem: "docker"
    directory: "/frontend"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 2
    labels:
      - "dependencies"
      - "docker"

  # ──────────────────────────────────────────────────────────────
  # GitHub Actions — weekly
  # ──────────────────────────────────────────────────────────────
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 2
    groups:
      github-actions:
        applies-to: version-updates
        patterns:
          - "*"
    labels:
      - "dependencies"
      - "ci"
